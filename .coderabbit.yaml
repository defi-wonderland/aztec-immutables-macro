# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
tone_instructions: >
  Be direct and technical. Focus on security, correctness, and the
  initializerless constants pattern in this Aztec / Noir codebase.

reviews:
  profile: assertive
  request_changes_workflow: true
  review_status: true
  commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  suggested_labels: false
  suggested_reviewers: true
  poem: false

  path_filters:
    - "!artifacts/**"
    - "!target/**"
    - "!node_modules/**"
    - "!store-*/**"
    - "!pxe-*/**"
    - "!codegenCache.json"
    - "!yarn.lock"
    - "!benchmarks/*.json"
    - "!.tsbuildinfo"
    - "!src/artifacts/**"

  path_instructions:
    - path: "src/nr/*_contract/src/main.nr"
      instructions: >
        Aztec smart contracts written in Noir. Review with focus on:


        **Initializerless constants pattern (CRITICAL):**
        - Contracts using constants MUST define a `#[constants] pub struct Constants`
          with the correct fields.
        - `Constants::init(self.context)` must be called in every private function
          that needs constants. The returned values are verified against the
          contract's `salt` via poseidon2 hash.
        - `Constants::init_unconstrained(self.context)` is ONLY allowed in
          `#[external("utility")] unconstrained fn` — never in constrained context.


        **Mixed usage (constants + storage):**
        - Contracts can combine `#[constants]` with `#[storage]` — they use
          different mechanisms (salt verification vs state tree).


        **Function access control (CRITICAL):**
        - Public state-mutating functions called only by the contract itself MUST
          use `#[only_self]` (NOT `#[internal]`). `#[only_self]` marks external
          functions callable only by the contract itself. `#[internal]` is for
          non-externally-callable internal functions.
        - Private-to-public transitions: private function enqueues a public
          `#[only_self]` function via `self.enqueue_self`.


        **Account contract specifics (Aztec v4):**
        - Entrypoint signature: `fn entrypoint(app_payload: AppPayload, fee_payment_method: u8, cancellable: bool)`.
        - Entrypoints MUST have `#[noinitcheck]` and `#[nophasecheck]`.
        - SchnorrConstantsAccount: signing key is loaded via constants pattern,
          not `SinglePrivateImmutable` storage. Verify Schnorr signature verification.
        - `is_valid_impl` must be a `#[contract_library_method]` taking `&mut PrivateContext`.
        - `lookup_validity` must be `#[external("utility")] unconstrained fn` and
          check both signature validity AND nullifier consumption status.
        - Note delivery uses `MessageDelivery.ONCHAIN_CONSTRAINED` in v4.


        **Code organization:**
        - Function order: initializers, private, public, view, unconstrained,
          internal, then library methods.
        - Imports grouped: Aztec core, external libs, custom types, globals.
        - Documentation uses `/// @notice`, `/// @dev`, `/// @param`, `/// @return`.
        - Library methods prefixed with underscore, internal functions suffixed
          with `_internal`.


        **Error handling:**
        - Assert messages should be descriptive and guide users to fix issues.
        - `unsafe` blocks must include a `// Safety:` comment explaining why they are safe.

    - path: "src/nr/initializerless/src/**/*.nr"
      instructions: >
        Core library implementing the `#[constants]` comptime macro. This is the
        heart of the initializerless constants pattern. Review with extreme care:


        **Macro correctness (CRITICAL):**
        - Must validate struct is named `Constants`.
        - Must derive Serialize/Deserialize if not already implemented.
        - Generated `init()` must: load capsule, compute poseidon2 hash,
          verify against `instance.salt`, deserialize constants.
        - Generated `init_unconstrained()` must skip verification (used only in
          utility functions).
        - `CONSTANTS_SLOT` must be derived from `poseidon2_hash_bytes("CONSTANTS_SLOT".as_bytes())`.


        **Deserialization (CRITICAL):**
        - Custom `derive_deserialize_if_not_implemented` uses fully-qualified
          `aztec::protocol::traits::Deserialize` to avoid import issues in macro expansion.
        - Field offset computation must be correct for multi-field structs.
        - `stream_deserialize` implementation must match `deserialize`.


        **Capsule data layout:**
        - Array is `[actual_salt, field_0, field_1, ...]` with size `1 + Serialize::N`.
        - First element is `actual_salt`, remaining are serialized constant fields.

    - path: "src/nr/constants/src/**/*.nr"
      instructions: >
        Alternative constants library (re-exports the macro). Verify module
        structure is correct and `pub use` paths are consistent.

    - path: "src/nr/*_contract/src/test/**/*.nr"
      instructions: >
        Noir unit tests using TestEnvironment. Check for:
        - Test coverage of both success and failure paths.
        - Edge cases (zero values, max values).
        - Proper use of `env.advance_block_by(1)` after private operations.
        - `#[test(should_fail_with = "...")]` for expected failures with correct messages.

    - path: "src/nr/**/public_key*.nr"
      instructions: >
        Custom Noir type definitions for public key notes. Verify:
        - Types implement required traits (Serialize, Deserialize, and
          NoteHash + NullifiableNote for note types).
        - Field layouts are correct for Grumpkin curve points (x, y coordinates).

    - path: "src/ts/**/*.ts"
      instructions: >
        TypeScript integration tests and utilities using @aztec/aztec.js. Verify:
        - Tests use generated artifacts from src/artifacts/.
        - PXE setup and teardown in lifecycle hooks (beforeAll/afterAll).
        - Constants deployment: salt must be computed as
          `poseidon2Hash([actualSalt, ...serializedConstants])`.
        - Capsule storage: constants must be pushed to PXE at the correct slot.
        - Transaction execution follows `.send().wait()` pattern (note: `.wait()` is dropped in v4).
        - Flag tests that duplicate Noir unit test coverage to avoid redundancy.

    - path: "benchmarks/**/*.ts"
      instructions: >
        Performance benchmark files using @defi-wonderland/aztec-benchmark.
        Verify benchmark operations are realistic and compare the constants
        pattern against traditional storage approaches.

    - path: "**/*.toml"
      instructions: >
        Noir project configuration. Verify:
        - Dependencies match the project Aztec version (check package.json config.aztecVersion).
        - Workspace members in root Nargo.toml include all contract packages
          (counter_contract, constants_contract, schnorr_account_contract,
          schnorr_constants_account_contract).
        - Library packages (initializerless, constants) are NOT workspace members
          (they are dependencies, not compiled contracts).
        - Package names follow snake_case naming conventions.

    - path: "package.json"
      instructions: >
        Project configuration. Verify:
        - All @aztec/* dependency versions are aligned with each other.
        - packageManager field is present and matches the expected Yarn version.
        - Node.js engine requirements are specified (>=22).

    - path: ".github/workflows/**"
      instructions: >
        CI/CD workflows. Ensure:
        - Aztec version is detected dynamically from package.json config.aztecVersion.
        - Docker setup is present for integration tests.
        - Test commands match package.json scripts (test:nr, test:js).
        - Concurrency groups prevent duplicate runs.
        - Node.js version matches project requirements (>=22).

  auto_review:
    drafts: false
    base_branches:
      - dev
      - main

  tools:
    eslint:
      enabled: true
    semgrep:
      enabled: true

chat:
  integrations:
    linear:
      usage: enabled

knowledge_base:
  linear:
    usage: enabled
