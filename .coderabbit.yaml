# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
tone_instructions: >
  Be direct and technical. Focus on security, correctness, and privacy
  implications in this Aztec/Noir smart contract codebase.

reviews:
  profile: assertive
  request_changes_workflow: true
  review_status: true
  commit_status: true
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  suggested_labels: false
  suggested_reviewers: true
  poem: false

  path_filters:
    - "!artifacts/**"
    - "!src/artifacts/**"
    - "!target/**"
    - "!node_modules/**"
    - "!codegenCache.json"
    - "!yarn.lock"
    - "!benchmarks/*.json"
    - "!.tsbuildinfo"
    - "!dist/**"

  path_instructions:
    - path: "src/nr/*_contract/src/main.nr"
      instructions: >
        Aztec smart contracts written in Noir. Review with focus on:


        **Immutables pattern (CRITICAL):**
        - Contracts using immutables MUST define a `#[immutables] pub struct Immutables`
          with the correct fields.
        - `Immutables::init(self.context)` must be called in every private function
          that needs immutables. The returned values are verified against the
          contract's `salt` via poseidon2 hash.
        - `Immutables::init_unconstrained(self.context)` is ONLY allowed in
          `#[external("utility")] unconstrained fn` — never in constrained context.
        - `Immutables::store()` persists capsule data to the PXE's CapsuleStore
          so subsequent calls don't need transient capsules.
        - Contracts SHOULD define a `#[external("utility")] unconstrained fn
          store_immutables` wrapper that delegates to `Immutables::store()`,
          to allow persisting capsule data to PXE and avoid passing transient
          capsules on every transaction. The macro cannot auto-emit external
          functions yet.


        **Mixed usage (immutables + storage):**
        - Contracts can combine `#[immutables]` with `#[storage]` — they use
          different mechanisms (salt verification vs state tree).


        **Function access control (CRITICAL):**
        - Public state-mutating functions called only by the contract itself MUST
          use `#[only_self]`. `#[internal]` is for non-externally-callable internal
          functions.
        - Private-to-public transitions: private function enqueues a public
          `#[only_self]` function via `self.enqueue_self`.


        **Account contract specifics:**
        - Entrypoint signature: `fn entrypoint(app_payload: AppPayload, fee_payment_method: u8, cancellable: bool)`.
        - SchnorrInitializerlessAccount (production): no initializer, so no
          `#[noinitcheck]` needed — only `#[allow_phase_change]` on entrypoint.
          Signing key is loaded via immutables pattern, not `SinglePrivateImmutable`
          storage. No note delivery — capsule storage replaces both.
        - SchnorrAccount (comparison only): standard account using
          `SinglePrivateImmutable` storage and `MessageDelivery.ONCHAIN_CONSTRAINED`
          for note initialization. Requires `#[noinitcheck]` and
          `#[allow_phase_change]` on entrypoint. Exists for benchmarking against
          the initializerless pattern.
        - `is_valid_impl` must be a `#[contract_library_method]` taking `&mut PrivateContext`.
        - `lookup_validity` must be `#[external("utility")] unconstrained fn` and
          check both signature validity AND nullifier consumption status.


        **Code organization:**
        - Function order: initializers, private, public, view, unconstrained,
          internal, then library methods.
        - Imports grouped: Aztec core, external libs, custom types, globals.
        - Documentation uses `/// @notice`, `/// @dev`, `/// @param`, `/// @return`.
        - Library methods prefixed with underscore, internal functions suffixed
          with `_internal`.


        **Error handling:**
        - Assert messages should be descriptive and guide users to fix issues.
        - `unsafe` blocks must include a `// Safety:` comment explaining why they are safe.

    - path: "src/nr/immutables/src/**/*.nr"
      instructions: >
        Core library implementing the `#[immutables]` comptime macro. This is the
        heart of the immutables pattern. Review with extreme care:


        **Macro correctness (CRITICAL):**
        - Must validate struct is named `Immutables`.
        - Must derive Serialize/Deserialize if not already implemented.
        - Generated `init()` must: load capsule, compute poseidon2 hash,
          verify against `instance.salt`, deserialize immutables.
        - Generated `init_unconstrained()` must skip verification (used only in
          utility functions).
        - Generated `store()` must persist capsule data to PXE via
          `aztec::oracle::capsules::store`, with poseidon2 validation against
          `instance.salt` before persisting.
        - Must emit `#[abi(immutables)]` layout for TypeScript artifact
          introspection (field names, indices, serialized length).
        - `IMMUTABLES_SLOT` must be derived from `poseidon2_hash_bytes("IMMUTABLES_SLOT".as_bytes())`.


        **Deserialization (CRITICAL):**
        - Custom `derive_deserialize_if_not_implemented` uses fully-qualified
          `aztec::protocol::traits::Deserialize` to avoid import issues in macro expansion.
        - Field offset computation must be correct for multi-field structs.


        **Capsule data layout:**
        - Array is `[actual_salt, field_0, field_1, ...]` with size `1 + Serialize::N`.
        - First element is `actual_salt`, remaining are serialized immutable fields.

    - path: "src/nr/*_contract/src/test/**/*.nr"
      instructions: >
        Noir unit tests using TestEnvironment. Check for:
        - Test coverage of both success and failure paths.
        - Edge cases (zero values, max values).
        - Proper use of `env.advance_block_by(1)` after private operations.
        - `#[test(should_fail_with = "...")]` for expected failures with correct messages.

    - path: "src/nr/**/public_key*.nr"
      instructions: >
        Custom Noir type definitions for public key types. Verify:
        - Types implement required traits (Serialize, Deserialize).
        - Field layouts are correct for Grumpkin curve points (x, y coordinates).

    - path: "src/ts/**/*.ts"
      instructions: >
        TypeScript tests and utilities using @aztec/aztec.js. Verify:
        - Tests use generated artifacts from src/artifacts/.
        - PXE setup and teardown in lifecycle hooks (beforeAll/afterAll).
        - Transaction execution follows `.send()` pattern.
        - `deployWithImmutables()` is used for deploying contracts with the
          immutables pattern — it handles salt computation, capsule creation,
          and persistent storage via `store_immutables`.
        - `deploySchnorrInitializerlessAccount()` wraps the generic deploy
          utility with account-specific logic.
        - Flag tests that duplicate Noir unit test coverage to avoid redundancy.

    - path: "benchmarks/**/*.ts"
      instructions: >
        Performance benchmark files using @defi-wonderland/aztec-benchmark.
        Verify benchmark operations are realistic and compare the immutables
        pattern against traditional storage approaches. Benchmarks should include
        the standard account deploy+initialize cost to show what the
        initializerless pattern eliminates.

    - path: "**/*.toml"
      instructions: >
        Noir project configuration. Verify:
        - Dependencies match the project Aztec version (check package.json config.aztecVersion).
        - Workspace members in root Nargo.toml include all contract packages.
        - Library packages (immutables) are NOT workspace members
          (they are dependencies, not compiled contracts).
        - Package names follow snake_case naming conventions.

    - path: "package.json"
      instructions: >
        Project configuration. Verify:
        - All @aztec/* dependency versions are aligned with each other.
        - packageManager field is present and matches the expected Yarn version.
        - Node.js engine requirements must pin an exact version (e.g., "22"), not a range (no >= or ~). The pinned version must be 22 or higher.
        - All dependencies are pinned to specific versions (no ^ or ~).

    - path: ".github/workflows/**"
      instructions: >
        CI/CD workflows. Ensure:
        - Reusable workflows reference defi-wonderland/aztec-ci-actions@v0 and
          defi-wonderland/aztec-benchmark@4.0.0-devnet.1-patch.0.
        - Concurrency groups prevent duplicate runs.
        - Benchmark and test jobs are separate in pr-checks.
        - Permissions are declared at the job level where needed.

  auto_review:
    drafts: false
    base_branches:
      - dev
      - main

  tools:
    eslint:
      enabled: true
    semgrep:
      enabled: true

chat:
  integrations:
    linear:
      usage: enabled

knowledge_base:
  linear:
    usage: enabled
