name: Main Tests

on:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    uses: defi-wonderland/aztec-ci-actions/.github/workflows/run-tests.yml@dev
    with:
      run-benchmark: false
      run-js-tests: true
      run-noir-tests: true
    secrets: inherit
